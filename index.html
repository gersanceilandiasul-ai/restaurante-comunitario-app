<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Restaurante Comunitário</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2874a6">

  <!-- iOS: sem esses meta tags o Safari não trata como "app" ao adicionar à tela de início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rest. Comunitário">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2874a6;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Tela de carregamento simples enquanto o iframe não termina de abrir */
    #carregando {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2874a6;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="carregando">Carregando...</div>

  <!--
    ⚠️ SUBSTITUA A LINHA ABAIXO PELA URL REAL DO SEU WEB APP DO APPS SCRIPT
    (a URL termina em /exec, do tipo:
     https://script.google.com/macros/s/AKfycb.../exec)
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbw---Gm-xTRAaGV_4puXUrhH5KApdMHzwoa8HdiCgdHeoZZ3u2LqmAdoBjOIiMepcCR/exec"
    allow="fullscreen"
    onload="document.getElementById('carregando').style.display='none';">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
