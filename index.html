<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Restaurante Comunitário</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2874a6">

  <!-- iOS: sem esses meta tags o Safari não trata como "app" ao adicionar à tela de início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rest. Comunitário">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2874a6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  Carregando...

  <script>
    var URL_DO_WEBAPP = "https://script.google.com/macros/s/AKfycbw---Gm-xTRAaGV_4puXUrhH5KApdMHzwoa8HdiCgdHeoZZ3u2LqmAdoBjOIiMepcCR/exec";

    function irParaOApp() {
      window.location.replace(URL_DO_WEBAPP);
    }

    // Sem <meta refresh>: registramos o Service Worker e só navegamos
    // DEPOIS que o registro terminar (ou falhar). Isso garante que o
    // Chrome reconheça a página como PWA instalável de verdade, e não
    // apenas crie um atalho comum que abre dentro do navegador.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .catch(function () { /* segue mesmo se o SW falhar ao registrar */ })
        .finally(irParaOApp);
    } else {
      irParaOApp();
    }
  </script>
</body>
</html>
