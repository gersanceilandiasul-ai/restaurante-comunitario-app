<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Restaurante Comunitário</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2874a6">

  <!-- iOS: sem esses meta tags o Safari não trata como "app" ao adicionar à tela de início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rest. Comunitário">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!--
    Redirecionamento imediato pro Web App do Apps Script.
    Não usamos mais <iframe> porque o Google bloqueia (X-Frame-Options)
    embutir páginas de Web App dentro de sites de fora do Google.
    Navegando direto (em vez de embutir), esse bloqueio não existe.
  -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbw---Gm-xTRAaGV_4puXUrhH5KApdMHzwoa8HdiCgdHeoZZ3u2LqmAdoBjOIiMepcCR/exec">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2874a6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  Carregando...

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    // Redundância ao <meta refresh> acima, caso o navegador demore a processá-lo
    window.location.replace("https://script.google.com/macros/s/AKfycbw---Gm-xTRAaGV_4puXUrhH5KApdMHzwoa8HdiCgdHeoZZ3u2LqmAdoBjOIiMepcCR/exec");
  </script>
</body>
</html>
